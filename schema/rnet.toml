# rnet.toml: the single definition of the home radio network protocol (ADR-0001 D1).
#
# Everything else (lib/rnet/gen C code, the gateway tables, the Python codec,
# docs/generated/messages.md, test/vectors) is generated from this file by
# tools/rnetgen. Edit here, never in the generated outputs.
#
# Evolution rules (ADR-0001 D3): fields are append-only within a message, with
# `since = N`. Removing, reordering or rescaling a field is breaking: new
# msg_type or a frame-version bump.
#
# Field types: u8 u16 u32 i8 i16 i32, "bits" (u8 bitfield), "tlv" (rest of payload).
# All multi-byte values are little-endian. Physical value = raw * scale.
# `invalid` is the raw sentinel meaning "not available".

schema_version = 1

# ---------------------------------------------------------------------------
# Frame (01-architecture.md section 4)
# ---------------------------------------------------------------------------
[frame]
version = 0                 # ctrl bits 7-6
max_payload = 61            # one CC1101 FIFO, length byte excluded
mic_len = 4                 # AES-128-CMAC truncated (O-2)
counter_persist_every = 256 # node stores ctr every N frames, resumes at stored + N (5.2)
header = [
  { name = "ctrl",      type = "u8" },
  { name = "net_id",    type = "u8" },
  { name = "node_id",   type = "u16" },
  { name = "node_type", type = "u8" },
  { name = "ctr",       type = "u32" },
  { name = "msg_type",  type = "u8" },
  # ack_ctr (u16) follows only when ctrl.ACK is set
]

[frame.ctrl_bits]
version = { shift = 6, width = 2 }
dir     = { shift = 5 }   # 0 uplink, 1 downlink
ack_req = { shift = 4 }
rx_open = { shift = 3 }   # uplink: node listens after this frame
ack     = { shift = 2 }   # ack_ctr present
more    = { shift = 1 }   # downlink: more queued, poll again

[frame.key_derivation]
# K_node = AES-128(master, node_id(LE u16) || node_type(u8) || "rnet" || zero padding to 16)
label = "rnet"

# ---------------------------------------------------------------------------
# PHY (section 3). rnetgen derives the CC1101 registers (26 MHz crystal) from
# these values; both the node driver (lib/node_l0) and the gateway's cc1101
# block use the generated output.
# ---------------------------------------------------------------------------
[phy]
xtal_hz = 26_000_000
freq_hz = 918_500_000
modulation = "gfsk"
data_rate_bps = 38_400
deviation_hz = 20_000
rx_bw_hz = 101_562          # nearest CC1101 step to ~100 kHz
preamble_bytes = 4
sync_mode = "30/32"
sync_word = 0xB54E          # PROPOSED: our own word, not the CC1101 default 0xD391 (review)
packet_length = "variable"
crc16 = true
whitening = true
rx_window_ms = 120          # RX_OPEN window W (6.2)
uplink_jitter_pct = 10      # 6.1

# ---------------------------------------------------------------------------
# Node types (frame header node_type) and per-type constants the gateway needs
# ---------------------------------------------------------------------------
[node_types.weather_acurite]
id = 0x01
consts = { rain_um_per_tip = 254 }   # 0.01 in

[node_types.weather_ws69]
id = 0x02
consts = { rain_um_per_tip = 300 }   # 0.3 mm (check at WS69 teardown)

[node_types.garden]
id = 0x10

[node_types.soil]
id = 0x20

# ---------------------------------------------------------------------------
# Enums shared by messages
# ---------------------------------------------------------------------------
[enums.reset_cause]
unknown = 0
power_on = 1
brown_out = 2
pin = 3
iwdg = 4
software = 5
lowpower = 6

# CONFIG TLV keys (type byte, length byte, value). Unknown keys are ignored by
# nodes and echoed back as absent in CONFIG_VAL.
[config_keys]
report_interval_s = { id = 0x01, type = "u16", unit = "s", min = 10, max = 3600 }
tx_power          = { id = 0x02, type = "u8", note = "PATABLE value; node clamps to its build-time cap" }
rx_open_every_n   = { id = 0x03, type = "u16", note = "set RX_OPEN on every Nth uplink" }
net_id            = { id = 0x04, type = "u8" }
# station calibration keys (0x40-0x7F) are defined per node type when needed

# ---------------------------------------------------------------------------
# Messages (section 7)
# ---------------------------------------------------------------------------
[messages.HEALTH]
id = 0x01
dir = "up"
node_types = ["weather_acurite", "weather_ws69", "garden", "soil"]
fields = [
  { name = "vbat",        type = "u16", scale = 1,   unit = "mV", ha = { device_class = "voltage", state_class = "measurement", entity_category = "diagnostic" } },
  { name = "vpanel",      type = "u16", scale = 1,   unit = "mV", invalid = 0xFFFF, ha = { device_class = "voltage", state_class = "measurement", entity_category = "diagnostic" } },
  { name = "board_temp",  type = "i16", scale = 0.1, unit = "°C", invalid = 0x7FFF, ha = { device_class = "temperature", state_class = "measurement", entity_category = "diagnostic" } },
  { name = "dl_rssi",     type = "i8",  scale = 1,   unit = "dBm", invalid = -128, ha = { device_class = "signal_strength", entity_category = "diagnostic" } },
  { name = "uptime",      type = "u32", scale = 1,   unit = "s", ha = { device_class = "duration", state_class = "total_increasing", entity_category = "diagnostic" } },
  { name = "fw_version",  type = "u16", note = "major << 8 | minor", ha = { entity_category = "diagnostic" } },
  { name = "schema_hash", type = "u16", note = "low 16 bits of the generator's schema hash", ha = { entity_category = "diagnostic" } },
  { name = "reset_cause", type = "u8",  enum = "reset_cause", ha = { entity_category = "diagnostic" } },
]

[messages.TIME]
id = 0x02
dir = "down"
node_types = ["weather_acurite", "weather_ws69", "garden", "soil"]
fields = [
  { name = "unix_time", type = "u32", unit = "s" },
]

[messages.CONFIG_SET]
id = 0x03
dir = "down"
node_types = ["weather_acurite", "weather_ws69", "garden", "soil"]
fields = [ { name = "items", type = "tlv", keys = "config_keys" } ]

[messages.CONFIG_GET]
id = 0x04
dir = "down"
node_types = ["weather_acurite", "weather_ws69", "garden", "soil"]
fields = [ { name = "keys", type = "tlv", keys = "config_keys", note = "TLVs with length 0: keys to report" } ]

[messages.CONFIG_VAL]
id = 0x05
dir = "up"
node_types = ["weather_acurite", "weather_ws69", "garden", "soil"]
fields = [ { name = "items", type = "tlv", keys = "config_keys" } ]

# weather_station ADR-0003 step 0 (accepted 2026-10-10). Sent every report
# interval (default 60 s), 3 identical repeats. Housekeeping beyond vbat is in
# HEALTH, sent hourly as the RX_OPEN frame.
[messages.WX_REPORT]
id = 0x10
dir = "up"
node_types = ["weather_acurite", "weather_ws69"]
fields = [
  { name = "interval_s",    type = "u16", scale = 1,    unit = "s", ha = { entity_category = "diagnostic" } },
  { name = "wind_mean",     type = "u16", scale = 0.01, unit = "m/s", ha = { device_class = "wind_speed", state_class = "measurement", accuracy_decimals = 1 } },
  { name = "wind_gust",     type = "u16", scale = 0.01, unit = "m/s", ha = { device_class = "wind_speed", state_class = "measurement", accuracy_decimals = 1 } },
  { name = "wind_lull",     type = "u16", scale = 0.01, unit = "m/s", ha = { device_class = "wind_speed", state_class = "measurement", accuracy_decimals = 1 } },
  { name = "wind_dir",      type = "u16", scale = 0.1,  unit = "°", invalid = 0xFFFF, note = "vector average; invalid when calm", ha = { device_class = "wind_direction", state_class = "measurement_angle", accuracy_decimals = 0 } },
  { name = "wind_dir_gust", type = "u16", scale = 0.1,  unit = "°", invalid = 0xFFFF, ha = { device_class = "wind_direction", state_class = "measurement_angle", accuracy_decimals = 0 } },
  { name = "rain_tips",     type = "u32", convert = "rain_um_per_tip", unit = "mm", note = "cumulative, survives resets", ha = { device_class = "precipitation", state_class = "total_increasing", accuracy_decimals = 2 } },
  { name = "temp",          type = "i16", scale = 0.01, unit = "°C", invalid = 0x7FFF, ha = { device_class = "temperature", state_class = "measurement", accuracy_decimals = 1 } },
  { name = "rh",            type = "u16", scale = 0.01, unit = "%", invalid = 0xFFFF, ha = { device_class = "humidity", state_class = "measurement", accuracy_decimals = 0 } },
  { name = "pressure",      type = "u32", scale = 0.01, unit = "hPa", invalid = 0xFFFFFFFF, note = "station level, raw unit Pa", ha = { device_class = "atmospheric_pressure", state_class = "measurement", accuracy_decimals = 1 } },
  { name = "vbat",          type = "u16", scale = 1,    unit = "mV", ha = { device_class = "voltage", state_class = "measurement", entity_category = "diagnostic" } },
  { name = "flags",         type = "bits", bits = { rain_unreliable = 0, calm = 1, th_fail = 2, baro_fail = 3, dir_fail = 4, charging = 5, prev_valid = 6 } },
  # R-3a: previous interval's wind summary; valid when flags.prev_valid
  { name = "prev_mean",     type = "u16", scale = 0.01, unit = "m/s" },
  { name = "prev_gust",     type = "u16", scale = 0.01, unit = "m/s" },
  { name = "prev_lull",     type = "u16", scale = 0.01, unit = "m/s" },
  { name = "prev_dir",      type = "u16", scale = 0.1,  unit = "°", invalid = 0xFFFF },
]
payload_len = 35   # checked by rnetgen

# Placeholders: payloads are defined when those projects' firmware starts.
# Rule (CLAUDE.md, garden R-3): no GARDEN_* downlink may open a valve without a
# non-zero duration; rnetgen will enforce it.
[messages.GARDEN_POLL]
id = 0x20
dir = "up"
node_types = ["garden"]
placeholder = true

[messages.GARDEN_RUN]
id = 0x21
dir = "down"
node_types = ["garden"]
placeholder = true

[messages.GARDEN_STOP]
id = 0x22
dir = "down"
node_types = ["garden"]
placeholder = true

[messages.GARDEN_EVENT]
id = 0x23
dir = "up"
node_types = ["garden"]
placeholder = true

[messages.SOIL_REPORT]
id = 0x30
dir = "up"
node_types = ["soil"]
placeholder = true
