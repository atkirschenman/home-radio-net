substitutions:
  device_name: radio-gateway
  friendly_name: Radio Gateway
  # UART to the weather board running the radio_bridge image (ADR-0003).
  bridge_rx_pin: GPIO16
  bridge_tx_pin: GPIO17

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  devices:
    - id: weather_station
      name: Weather Station

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

external_components:
  - source: github://atkirschenman/home-radio-net@feat/gateway-bridge
    path: esphome/components
    components: [radio_net]
    refresh: 1h

# Bridge: ESP32 3V3 to battery + pad (cells out), GND to battery - pad,
# bridge_rx_pin to PA9 (USART1 TX), bridge_tx_pin to PA10 (USART1 RX).
uart:
  id: bridge_uart
  rx_pin: ${bridge_rx_pin}
  tx_pin: ${bridge_tx_pin}
  baud_rate: 115200

radio_net:
  uart_id: bridge_uart
  master_key: !secret rnet_master_key
  nodes:
    - node_id: 0x3D18
      type: weather_acurite
      name: Weather Station
      device_id: weather_station
  frames_received:
    name: "Frames received"
  frames_rejected:
    name: "Frames rejected"
  bridge_online:
    name: "Radio bridge"

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
