; ESP32 as a USB serial terminal for the radio bridge (ADR-0003): bridge lines
; appear on the USB port, and lines typed there go to the bridge.
; Build/flash/monitor:  pio run -t upload -t monitor   (from this directory)
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
