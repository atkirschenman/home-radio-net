; CC1101 wiring check for the ESP32 bench receiver: pio run -t upload -t monitor
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<*> -<line_toggle.cpp> -<raw_read.cpp>

; Multimeter check: drives SCK, MOSI and CSN one at a time, 3 s high then 3 s low
[env:line_toggle]
extends = env:esp32dev
build_src_filter = +<line_toggle.cpp>

; One register read clocked by hand, every bit printed
[env:raw_read]
extends = env:esp32dev
build_src_filter = +<raw_read.cpp>
