; Bench receiver: ESP32 DevKitC + any CC1101 module. Prints link-test packets
; and verifies/decodes rnet frames under the published test master key.
; Build/flash/monitor:  pio run -t upload -t monitor   (from this directory)
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/../../../lib/node_l0/include
    -I${PROJECT_DIR}/../../../lib/rnet/gen
    -I${PROJECT_DIR}/../../../lib/rnet/include
    -I${PROJECT_DIR}/../../../lib/rnet/vendor/tinycrypt/include
    -I${PROJECT_DIR}/..
